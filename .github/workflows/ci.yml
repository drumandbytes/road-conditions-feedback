name: CI

# Issue-tracker repo, no code — this just validates the issue templates and
# hosts the gate the org's protecting-main ruleset requires.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-issue-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate issue templates
        run: |
          python - <<'PY'
          import glob, yaml
          for f in glob.glob(".github/ISSUE_TEMPLATE/*.yml"):
              yaml.safe_load(open(f))
              print("ok", f)
          PY

  # Single stable name for the org's required-status-check ruleset to point
  # at, regardless of how the real jobs above are split or renamed.
  required-checks-passed:
    name: Required checks passed
    runs-on: ubuntu-latest
    needs: [validate-issue-templates]
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
